seed: 7

data:
  nuscenes_root: ""
  cache_root: ""
  version: "v1.0-trainval"
  train_split: "train"
  val_split: "val"
  num_workers: 0
  synthetic_size: 32

bev:
  x_min: -20.0
  x_max: 80.0
  y_min: -40.0
  y_max: 40.0
  resolution: 2.0
  channels:
    - drivable
    - lane
    - route
    - agents
    - ego

model:
  latent_dim: 32
  hidden_dim: 48
  proposal_latent_dim: 16
  perturb_dim: 8
  trajectory_dim: 4
  occupancy_channels: 3
  risk_names:
    - collision
    - offroad
    - redlight
  risk_weights:
    collision: 8.0
    offroad: 5.0
    redlight: 3.0
    uncertainty: 1.0
    progress: 1.0
    comfort: 0.2

planning:
  horizon_steps: 8
  dt: 0.5
  num_candidates: 8
  max_speed_mps: 18.0
  max_abs_y: 38.0
  max_x: 80.0
  min_x: -10.0

training:
  batch_size: 2
  effective_batch_size: 4
  epochs: 1
  lr: 0.0003
  weight_decay: 0.01
  amp: false
  grad_clip_norm: 1.0
  negative_ratio: 0.5
  clean_ratio: 0.7
  output_dir: "outputs"

perturbations:
  enabled: true
  max_delay_steps: 1
  bev_dropout_prob: 0.1
  agent_dropout_prob: 0.15
  ego_noise_std:
    x: 0.15
    y: 0.15
    yaw: 0.02
    speed: 0.2
